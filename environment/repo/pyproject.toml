[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "release_gate"
version = "0.1.0"
description = "CI helper to ship or block model builds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
"release-gate" = "release_gate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["release_gate*"]
